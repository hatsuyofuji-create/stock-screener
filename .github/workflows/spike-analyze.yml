# 急騰要因分析を GitHub Actions 上で実行する（パソコンにコピー不要）
#
# Actions タブ → spike-analyze → Run workflow で銘柄コードを入れて実行すると、
# ログに急騰日と要因が出る。結果 JSON はアーティファクトとしてダウンロードできる。
# 必要なシークレット: JQUANTS_API_KEY（jp-sector-flow と共通）、EDINET_API_KEY（任意）
name: spike-analyze

on:
  workflow_dispatch:
    inputs:
      code:
        description: "銘柄コード（例: 7203）"
        default: "7203"
      years:
        description: "遡る年数（Light は最大5）"
        default: "1"
      news:
        description: "ニュース見出しも取る"
        type: boolean
        default: true
      tdnet_days:
        description: "TDnet 公式クロールの動作確認日数（0 で省略・保存はしない）"
        default: "3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jp-spike-analyzer
    env:
      PROVIDER: jquants
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy requests python-dotenv beautifulsoup4
      - name: TDnet crawl check
        if: ${{ inputs.tdnet_days != '0' }}
        run: python update_daily.py --days ${{ inputs.tdnet_days }}
      - name: Analyze
        run: |
          NEWS_FLAG=""
          if [ "${{ inputs.news }}" != "true" ]; then NEWS_FLAG="--no-news"; fi
          python analyze.py "${{ inputs.code }}" --years "${{ inputs.years }}" $NEWS_FLAG
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-analysis-${{ inputs.code }}
          path: |
            jp-spike-analyzer/db/analysis/*.json
            jp-spike-analyzer/db/tdnet/*.csv
          if-no-files-found: ignore
