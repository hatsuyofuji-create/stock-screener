# 適時開示（TDnet 公式）の日次蓄積
#
# JPX の TDnet 一覧は直近1か月しか見られないため、毎営業日クロールして
# jp-spike-analyzer/db/tdnet/YYYY-MM.csv に貯める。シークレットは不要。
name: spike-tdnet-daily

on:
  schedule:
    # 平日 09:30 UTC = 18:30 JST（引け後）
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "遡る日数（初回は 30 程度）"
        default: "3"
      force:
        description: "土日でも強制実行する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jp-spike-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests python-dotenv beautifulsoup4
      - name: Crawl TDnet
        run: python update_daily.py --days ${{ inputs.days || '3' }}
        env:
          FORCE_RUN: ${{ inputs.force }}
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add db/tdnet/*.csv || true
          git commit -m "update tdnet disclosures" || echo "no changes"
          git push
